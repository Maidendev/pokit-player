name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platformFlag: --win
            artifact: windows-installers
            paths: |
              dist/*.exe
              dist/latest.yml
          - os: macos-latest
            platformFlag: --mac
            artifact: macos-installers
            paths: |
              dist/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install

      # On a version tag, publish straight to a GitHub Release — that Release
      # is the update feed electron-updater polls on installed desktops.
      # On any other trigger (push to main, PR), build only, never publish.
      - name: Build
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            npx electron-builder ${{ matrix.platformFlag }} --publish always
          else
            npx electron-builder ${{ matrix.platformFlag }} --publish never
          fi
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tag builds publish installers straight to the GitHub Release (above) —
      # that's the real deliverable and doesn't count against Actions storage
      # quota. This upload is just a short-lived preview for push/PR builds.
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 5
