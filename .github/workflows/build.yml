name: Build installers

on:
  push:
    # feat/** builds both platforms without opening a PR. It never publishes —
    # only a v* tag does that — so this is a safe way to get a macOS build off
    # a Windows workstation.
    branches: [main, 'feat/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platformFlag: --win
            artifact: windows-installers
            paths: |
              dist/*.exe
              dist/latest.yml
          - os: macos-latest
            platformFlag: --mac
            artifact: macos-installers
            paths: |
              dist/*.dmg
              dist/*.zip
              dist/latest-mac.yml

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install

      # ffmpeg-static installs exactly ONE binary — the arch of the machine it
      # was installed on (see node_modules/ffmpeg-static/index.js). The macOS
      # runner is arm64, but `--mac` produces BOTH an arm64 and an x64 DMG from
      # that single install, so the Intel DMG would ship an arm64 ffmpeg and
      # every transcode would fail on Intel hardware.
      #
      # Fetch both explicitly via ffmpeg-static's own npm_config_arch override
      # (same download source as the dependency itself — no new supply chain)
      # and drop them where transcoder.js already looks first:
      # src/bin/ffmpeg-darwin-${process.arch}.
      - name: Fetch both macOS ffmpeg architectures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/bin
          # install.js writes to a FIXED path — node_modules/ffmpeg-static/ffmpeg
          # — regardless of arch; npm_config_arch only picks the download URL.
          # It also short-circuits with "ffmpeg is installed already" when that
          # path exists, and `npm install` above has already put the RUNNER's
          # arch there. So the override was silently ignored and both copies
          # came out arm64. Delete the file before each fetch, and call
          # install.js directly so the env override cannot be dropped by npm's
          # config forwarding.
          for arch in x64 arm64; do
            echo "==> Fetching darwin/${arch} ffmpeg"
            rm -f node_modules/ffmpeg-static/ffmpeg
            npm_config_platform=darwin npm_config_arch="$arch" \
              node node_modules/ffmpeg-static/install.js
            cp node_modules/ffmpeg-static/ffmpeg "src/bin/ffmpeg-darwin-${arch}"
            chmod +x "src/bin/ffmpeg-darwin-${arch}"
          done
          # arm64 ran last, so node_modules/ffmpeg-static/ffmpeg holds the
          # runner's own arch — the same state a plain `npm install` leaves.
          # Verify each binary is really the arch it claims. A silent fallback
          # to the host arch here is exactly the bug this step exists to stop.
          for arch in x64 arm64; do
            f="src/bin/ffmpeg-darwin-${arch}"
            echo "--- $f"
            file "$f"
            expected="$arch"; [[ "$arch" == "x64" ]] && expected="x86_64"
            file "$f" | grep -q "$expected" || {
              echo "ERROR: $f is not $expected"; exit 1; }
          done

      # Say plainly in the log whether this build will be signed. Without this
      # an unsigned build looks identical to a signed one until a user hits
      # the Gatekeeper warning.
      - name: Report signing configuration
        if: matrix.os == 'macos-latest'
        shell: bash
        # Secrets arrive through env, never through ${{ }} interpolation into
        # the script body: that would write the whole base64 signing
        # certificate into the command line of a temp file on the runner.
        # Only the emptiness of each value is ever tested here.
        env:
          HAS_CERT: ${{ secrets.MAC_CSC_LINK != '' }}
          HAS_CERT_PW: ${{ secrets.MAC_CSC_KEY_PASSWORD != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_APPLE_PW: ${{ secrets.APPLE_ID_PASSWORD != '' }}
          HAS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
        run: |
          echo "MAC_CSC_LINK         present: $HAS_CERT"
          echo "MAC_CSC_KEY_PASSWORD present: $HAS_CERT_PW"
          echo "APPLE_ID             present: $HAS_APPLE_ID"
          echo "APPLE_ID_PASSWORD    present: $HAS_APPLE_PW"
          echo "APPLE_TEAM_ID        present: $HAS_TEAM_ID"
          echo

          if [[ "$HAS_CERT" == "true" && "$HAS_CERT_PW" == "true" ]]; then
            echo "macOS code signing: ENABLED"
          else
            echo "macOS code signing: DISABLED — MAC_CSC_LINK and/or"
            echo "MAC_CSC_KEY_PASSWORD missing. Build will be unsigned and"
            echo "Gatekeeper will refuse to open it on other people's Macs."
          fi

          if [[ "$HAS_APPLE_ID" == "true" && "$HAS_APPLE_PW" == "true" && "$HAS_TEAM_ID" == "true" ]]; then
            echo "Notarization: ENABLED"
          else
            echo "Notarization: DISABLED — APPLE_ID, APPLE_ID_PASSWORD or"
            echo "APPLE_TEAM_ID missing. A signed-but-unnotarized app still"
            echo "warns on first launch."
          fi

      # On a version tag, publish straight to a GitHub Release — that Release
      # is the update feed electron-updater polls on installed desktops.
      # On any other trigger (push to main, PR), build only, never publish.
      - name: Build
        shell: bash
        run: |
          # A secret that doesn't exist still arrives as a DEFINED, empty env
          # var. electron-builder reads a defined CSC_LINK as a path to a
          # certificate, resolves "" to the repo root, and dies with
          # "<repo root> not a file". Unset these unless they carry a value so
          # the unsigned path behaves as if they were never referenced.
          if [[ -z "${CSC_LINK:-}" ]]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [[ -z "${APPLE_ID:-}" ]]; then unset APPLE_ID APPLE_ID_PASSWORD APPLE_TEAM_ID; fi

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            npx electron-builder ${{ matrix.platformFlag }} --publish always
          else
            npx electron-builder ${{ matrix.platformFlag }} --publish never
          fi
        env:
          # Windows has no certificate configured, so keep auto-discovery off
          # there. On macOS, signing is driven by CSC_LINK / CSC_KEY_PASSWORD;
          # when those secrets are absent electron-builder logs that it cannot
          # find a certificate and produces an unsigned build rather than
          # failing, so this stays safe before the secrets are added.
          # Only turn identity discovery on when a certificate is actually
          # present. With it on and no cert in the keychain, electron-builder
          # tries to sign and fails the build — which is what happened when
          # this was unconditionally 'true' on macOS.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK != '') && 'true' || 'false' }}
          # Base64-encoded .p12 and its password.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # Consumed by scripts/notarize.js in the afterSign hook. Notarization
          # requires a signed app — without CSC_LINK these do nothing.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Works around a longstanding electron-builder bug where its
          # hardlink-based file copier loses an exists-check and throws
          # EEXIST on macOS (electron-userland/electron-builder#3179,
          # #7093, #6570). Forces real copies instead of hardlinks.
          USE_HARD_LINKS: false

      # Prove BOTH Mac builds exist and that each one is genuinely the arch it
      # is named for. Cross-arch mistakes here are invisible until an Intel
      # user launches an arm64 binary, so assert it in CI instead.
      - name: Verify Intel + Apple Silicon builds
        if: runner.os == 'macOS'
        shell: bash
        # Whether signing / notarization was CONFIGURED for this run. When it
        # was, a build that comes out unsigned or unstapled must FAIL the job
        # rather than just print a note: downloading Actions logs needs admin
        # rights on the repo, so for anyone without them the step conclusion
        # is the only visible signal. Only emptiness of each secret is tested.
        env:
          SIGNING_EXPECTED: ${{ secrets.MAC_CSC_LINK != '' && secrets.MAC_CSC_KEY_PASSWORD != '' }}
          NOTARIZE_EXPECTED: ${{ secrets.MAC_CSC_LINK != '' && secrets.APPLE_ID != '' && secrets.APPLE_ID_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          set -euo pipefail
          echo "=== dist ==="
          ls -lh dist/*.dmg dist/*.zip dist/latest-mac.yml 2>/dev/null || true

          fail=0
          check() {  # <app path> <expected lipo arch> <label>
            local app="$1" want="$2" label="$3"
            if [[ ! -d "$app" ]]; then
              echo "MISSING: $app ($label)"; fail=1; return
            fi
            local bin="$app/Contents/MacOS/MaidenPlayer"
            echo "--- $label: $app"
            echo "    app binary : $(lipo -archs "$bin")"
            lipo -archs "$bin" | grep -qw "$want" || {
              echo "    ERROR: expected $want"; fail=1; }
            # The bundled ffmpeg must match too — this is the one that silently
            # ships wrong and only fails at transcode time.
            local ff
            # -type f has to apply to BOTH -name branches, hence the parens.
            # `|| true` because head closing the pipe early can SIGPIPE find,
            # and pipefail would then abort the whole step.
            ff=$(find "$app" \( -name 'ffmpeg-darwin-*' -o -name 'ffmpeg' \) -type f 2>/dev/null | head -1) || true
            if [[ -n "$ff" ]]; then
              echo "    ffmpeg     : $(lipo -archs "$ff")  ($(basename "$ff"))"
            fi

            # --- Signature ---------------------------------------------------
            local sig
            sig=$(codesign -dv --verbose=2 "$app" 2>&1) || true
            grep -E 'Authority|TeamIdentifier|Timestamp|flags' <<<"$sig" | sed 's/^/    /' || true
            codesign --verify --deep --strict "$app" 2>&1 | tail -2 | sed 's/^/    verify: /' || true
            if [[ "${SIGNING_EXPECTED:-false}" == "true" ]]; then
              grep -q 'Authority=Developer ID Application' <<<"$sig" || {
                echo "    ERROR: a certificate was configured, but this app is"
                echo "           NOT signed with a Developer ID Application cert."
                fail=1; }
            fi

            # --- Notarization ticket ----------------------------------------
            # Without a STAPLED ticket the app still warns on first launch on
            # a machine that has never seen it, so assert the stapled state,
            # not merely that Gatekeeper accepts it.
            local gate
            gate=$(spctl -a -vvv -t exec "$app" 2>&1) || true
            head -3 <<<"$gate" | sed 's/^/    /' || true
            if [[ "${NOTARIZE_EXPECTED:-false}" == "true" ]]; then
              grep -q 'source=Notarized Developer ID' <<<"$gate" || {
                echo "    ERROR: notarization was configured, but no stapled"
                echo "           ticket is present — Gatekeeper will still warn."
                fail=1; }
            fi
          }

          check "dist/mac/MaidenPlayer.app"       x86_64 "Intel (x64)"
          check "dist/mac-arm64/MaidenPlayer.app" arm64  "Apple Silicon (arm64)"

          for f in dist/MaidenPlayer-*-x64.dmg dist/MaidenPlayer-*-arm64.dmg; do
            [[ -f "$f" ]] || { echo "MISSING DMG: $f"; fail=1; }
          done

          [[ "$fail" == "0" ]] || { echo "Mac build verification FAILED"; exit 1; }
          echo "Both Mac builds verified."

      # Tag builds publish installers straight to the GitHub Release (above) —
      # that's the real deliverable and doesn't count against Actions storage
      # quota. This upload is just a short-lived preview for push/PR builds.
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 5
