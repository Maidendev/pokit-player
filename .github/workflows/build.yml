name: Build installers

on:
  push:
    # feat/** builds both platforms without opening a PR. It never publishes —
    # only a v* tag does that — so this is a safe way to get a macOS build off
    # a Windows workstation.
    branches: [main, 'feat/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platformFlag: --win
            artifact: windows-installers
            paths: |
              dist/*.exe
              dist/latest.yml
          # macOS is built once per architecture, on a runner of that
          # architecture. It used to be a single macos-latest job, which is an
          # arm64 runner: npm install fetched the arm64 ffmpeg and
          # electron-builder packaged it into BOTH the arm64 and the x64 DMG.
          # The Intel build therefore shipped a binary that could not execute
          # on an Intel Mac. Splitting the jobs is what prevents that, because
          # each runner can only produce its own architecture.
          - os: macos-14
            platformFlag: --mac --arm64
            artifact: macos-installers-arm64
            paths: |
              dist/*.dmg
              dist/*.zip
              dist/latest-mac.yml
          - os: macos-13
            platformFlag: --mac --x64
            artifact: macos-installers-x64
            paths: |
              dist/*.dmg
              dist/*.zip
              dist/latest-mac.yml

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # postinstall fetches the pinned LGPL ffmpeg/ffprobe for Windows and
      # Linux. On macOS it is a no-op and the build step below compiles them.
      - run: npm install

      - name: Build LGPL FFmpeg (macOS only)
        if: startsWith(matrix.os, 'macos')
        run: ./scripts/build-ffmpeg-macos.sh

      # Hard gate. Reads the compiled-in configure line out of every media
      # binary and fails the build if any of them is GPL or non-distributable.
      # This is what stops a GPL or --enable-nonfree binary reaching an
      # installer again — pinned URLs say where a binary came from, only this
      # says what is in it.
      - name: Verify FFmpeg licence
        run: npm run ffmpeg:verify

      # Fails if any component in the dependency tree is copyleft or of
      # undetermined licence. Kept separate from the FFmpeg gate so a failure
      # says which of the two problems occurred.
      - name: Verify open-source licence position
        run: npm run oss:check

      # Say plainly in the log whether this build will be signed. Without this
      # an unsigned build looks identical to a signed one until a user hits
      # the Gatekeeper warning.
      - name: Report signing configuration
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          if [[ -n "${{ secrets.MAC_CSC_LINK }}" ]]; then
            echo "macOS code signing: ENABLED (MAC_CSC_LINK present)"
          else
            echo "macOS code signing: DISABLED — no MAC_CSC_LINK secret."
            echo "Build will be unsigned; users will see a Gatekeeper warning."
          fi
          if [[ -n "${{ secrets.APPLE_ID }}" && -n "${{ secrets.APPLE_TEAM_ID }}" ]]; then
            echo "Notarization: ENABLED"
          else
            echo "Notarization: DISABLED — APPLE_ID / APPLE_TEAM_ID not set."
          fi

      # On a version tag, publish straight to a GitHub Release — that Release
      # is the update feed electron-updater polls on installed desktops.
      # On any other trigger (push to main, PR), build only, never publish.
      - name: Build
        shell: bash
        run: |
          # A secret that doesn't exist still arrives as a DEFINED, empty env
          # var. electron-builder reads a defined CSC_LINK as a path to a
          # certificate, resolves "" to the repo root, and dies with
          # "<repo root> not a file". Unset these unless they carry a value so
          # the unsigned path behaves as if they were never referenced.
          if [[ -z "${CSC_LINK:-}" ]]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [[ -z "${APPLE_ID:-}" ]]; then unset APPLE_ID APPLE_ID_PASSWORD APPLE_TEAM_ID; fi

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            npx electron-builder ${{ matrix.platformFlag }} --publish always
          else
            npx electron-builder ${{ matrix.platformFlag }} --publish never
          fi
        env:
          # Windows has no certificate configured, so keep auto-discovery off
          # there. On macOS, signing is driven by CSC_LINK / CSC_KEY_PASSWORD;
          # when those secrets are absent electron-builder logs that it cannot
          # find a certificate and produces an unsigned build rather than
          # failing, so this stays safe before the secrets are added.
          # Only turn identity discovery on when a certificate is actually
          # present. With it on and no cert in the keychain, electron-builder
          # tries to sign and fails the build — which is what happened when
          # this was unconditionally 'true' on macOS.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK != '') && 'true' || 'false' }}
          # Base64-encoded .p12 and its password.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # Consumed by scripts/notarize.js in the afterSign hook. Notarization
          # requires a signed app — without CSC_LINK these do nothing.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Works around a longstanding electron-builder bug where its
          # hardlink-based file copier loses an exists-check and throws
          # EEXIST on macOS (electron-userland/electron-builder#3179,
          # #7093, #6570). Forces real copies instead of hardlinks.
          USE_HARD_LINKS: false

      # Tag builds publish installers straight to the GitHub Release (above) —
      # that's the real deliverable and doesn't count against Actions storage
      # quota. This upload is just a short-lived preview for push/PR builds.
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 5
